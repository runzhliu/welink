root = "/workspace"
tmp_dir = "/tmp/welink-air"

[build]
cmd = "go build -o /tmp/welink-air/server ."
bin = "/tmp/welink-air/server"
include_ext = ["go", "mod", "sum"]
exclude_dir = ["data", "prefs", "static", "vendor", ".git"]
exclude_regex = ["_test.go"]
delay = 800
poll = true
poll_interval = 500
stop_on_error = true
send_interrupt = true
kill_delay = "2s"
