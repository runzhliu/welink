name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "版本号（如 v1.0.1），留空则用 dev-<sha>"
        required: false
  push:
    tags:
      - "v*"
    branches:
      - dev

permissions:
  contents: write

jobs:
  # ─── 创建 Release，写完整说明 ─────────────────────────────────────────────────
  prepare:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      existing_release: ${{ steps.existing_release.outputs.skip }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # v0.4.0 was explicitly published with unverified hardware evidence and
      # manually built assets. A manual reconciliation must never overwrite it
      # or pretend that the hardware gate passed. New releases retain the gate.
      - name: 核对已发布的 v0.4.0
        id: existing_release
        if: github.event_name == 'workflow_dispatch' && inputs.tag == 'v0.4.0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          EXPECTED_COMMIT=1d737143e53f49ec1836d452703f4408b7214d47
          test "$(git rev-parse 'refs/tags/v0.4.0^{commit}')" = "$EXPECTED_COMMIT"
          release=$(gh release view v0.4.0 --json isDraft,isPrerelease,assets)
          echo "$release" | jq -e '.isDraft == false and .isPrerelease == false' >/dev/null
          echo "$release" | jq -e '[.assets[] | select(.name == "WeLink.dmg" and .digest == "sha256:5aa25445e0e875745cb59c3610a3e74bfa408ef630ed26aed6c6057991fd6489")] | length == 1' >/dev/null
          echo "$release" | jq -e '[.assets[] | select(.name == "WeLink-windows-amd64.zip" and .digest == "sha256:add7ec960199be1faacc775ab8595ced6c000bcabdade3e1742055e859151683")] | length == 1' >/dev/null
          echo 'skip=true' >> "$GITHUB_OUTPUT"
          echo '### 已发布版本核对' >> "$GITHUB_STEP_SUMMARY"
          echo '已核对 v0.4.0 标签和现有安装包摘要。本次未重新构建或覆盖发布文件。MLX、CUDA 和视觉完整验收仍未完成。' >> "$GITHUB_STEP_SUMMARY"
          echo '::warning::仅核对既有发布；MLX、CUDA 和视觉完整验收仍未完成。'

      # v0.4.1 has a one-time owner-approved exception. Do not extend it to
      # other tags: the hardware and visual evidence is still incomplete.
      - name: 记录 v0.4.1 的单次验收例外
        if: steps.existing_release.outputs.skip != 'true' && github.event_name == 'push' && github.ref == 'refs/tags/v0.4.1'
        run: |
          echo '::warning::v0.4.1 经项目维护者批准例外发布；MLX、CUDA 完整硬件验收及视觉验收仍未完成。'
          echo '### v0.4.1 验收状态' >> "$GITHUB_STEP_SUMMARY"
          echo '维护者批准单次例外：MLX、CUDA 完整硬件验收及视觉验收仍未完成；后续版本继续执行验收门槛。' >> "$GITHUB_STEP_SUMMARY"

      - name: Validate SFT hardware evidence for 4.x releases
        if: steps.existing_release.outputs.skip != 'true' && !(github.event_name == 'push' && github.ref == 'refs/tags/v0.4.1')
        env:
          SFT_RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: python3 scripts/check_sft_release.py --tag "$SFT_RELEASE_TAG"

      - name: 确定版本号和发布类型
        if: steps.existing_release.outputs.skip != 'true'
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            # Keep the release private until both platform assets have landed.
            echo "draft=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ] && [[ "${{ github.ref }}" == refs/heads/dev ]]; then
            echo "tag=dev-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "draft=false" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ inputs.tag }}" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "draft=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag=dev-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "draft=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 生成 Changelog
        if: steps.existing_release.outputs.skip != 'true'
        id: changelog
        run: |
          PREV=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV" ]; then
            COMMITS=$(git log ${PREV}..HEAD --pretty=format:"%s" --no-merges)
          else
            COMMITS=$(git log --pretty=format:"%s" --no-merges)
          fi

          FEAT="" FIX="" CHORE="" DOCS=""
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            case "$line" in
              feat:*|feat\(*) FEAT="$FEAT\n- ${line#*: }" ;;
              fix:*|fix\(*)   FIX="$FIX\n- ${line#*: }" ;;
              docs:*|doc:*)   DOCS="$DOCS\n- ${line#*: }" ;;
              chore:*|ci:*|refactor:*|perf:*|test:*) CHORE="$CHORE\n- ${line#*: }" ;;
              *)              CHORE="$CHORE\n- $line" ;;
            esac
          done <<< "$COMMITS"

          NOTES=""
          [ -n "$FEAT" ]  && NOTES="$NOTES\n## ✨ 新功能\n$FEAT\n"
          [ -n "$FIX" ]   && NOTES="$NOTES\n## 🐛 修复\n$FIX\n"
          [ -n "$DOCS" ]  && NOTES="$NOTES\n## 📖 文档\n$DOCS\n"
          [ -n "$CHORE" ] && NOTES="$NOTES\n## 🔧 工程\n$CHORE\n"

          if [ "${{ steps.version.outputs.tag }}" = 'v0.4.1' ]; then
            NOTES="$NOTES\n## SFT 验收状态\n\n本版本经维护者批准单次例外发布。MLX、CUDA 完整硬件验收及桌面、移动端、深浅色、键盘和隐私模式视觉验收仍未完成。CUDA L20 已使用合成数据完成一次训练、评测和流式试聊；详见 [SFT 发布验收清单](https://github.com/runzhliu/welink/blob/v0.4.1/docs/sft-release-checklist.md)。后续版本继续执行原有验收门槛。\n"
          fi

          printf "notes<<EOF\n" >> "$GITHUB_OUTPUT"
          printf "$NOTES\n" >> "$GITHUB_OUTPUT"
          printf "EOF\n" >> "$GITHUB_OUTPUT"

      - name: 创建 Release
        if: steps.existing_release.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "WeLink ${{ steps.version.outputs.tag }}"
          draft: ${{ steps.version.outputs.draft }}
          prerelease: ${{ steps.version.outputs.prerelease }}
          body: ${{ steps.changelog.outputs.notes }}

  # ─── macOS DMG ──────────────────────────────────────────────────────────────
  build-dmg:
    name: macOS DMG
    needs: prepare
    if: needs.prepare.outputs.existing_release != 'true'
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: 预检查 lockfile registry 白名单
        run: node scripts/check-lockfile-registry.js frontend/package-lock.json

      - name: Build DMG
        run: make dmg

      - name: 计算 SHA256
        id: sha256
        run: |
          echo "sum=$(shasum -a 256 dist/WeLink.dmg | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: 上传 DMG 到 Release
        run: gh release upload ${{ needs.prepare.outputs.tag }} dist/WeLink.dmg --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── Windows EXE ────────────────────────────────────────────────────────────
  build-exe:
    name: Windows EXE
    needs: prepare
    if: needs.prepare.outputs.existing_release != 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install goversioninfo
        run: go install github.com/josephspurrier/goversioninfo/cmd/goversioninfo@latest
        working-directory: backend

      - name: 预检查 lockfile registry 白名单
        run: node scripts/check-lockfile-registry.js frontend/package-lock.json

      - name: Build EXE
        run: make exe

      - name: 计算 SHA256
        id: sha256
        run: |
          echo "sum=$(sha256sum dist/WeLink-windows-amd64.zip | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: 上传 EXE 到 Release
        run: gh release upload ${{ needs.prepare.outputs.tag }} dist/WeLink-windows-amd64.zip --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-stable:
    name: 核对安装包并发布正式版
    needs: [prepare, build-dmg, build-exe]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.prepare.outputs.existing_release != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: 核对安装包并发布
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --json isDraft,assets | jq -e '.isDraft == true and ([.assets[] | select(.name == "WeLink.dmg" and .digest != null)] | length == 1) and ([.assets[] | select(.name == "WeLink-windows-amd64.zip" and .digest != null)] | length == 1)' >/dev/null
          gh release edit "$RELEASE_TAG" --draft=false --latest
