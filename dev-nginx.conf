server {
    listen 80;
    server_name ${DEV_DOMAIN};
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name ${DEV_DOMAIN};

    ssl_certificate     /etc/certs/cert.pem;
    ssl_certificate_key /etc/certs/cert.key;

    client_max_body_size 64m;
    proxy_buffering off;
    proxy_read_timeout 600s;

    ssl_session_timeout 1d;
    ssl_session_cache   shared:SSL:10m;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Worker traffic goes directly from the TLS terminator to the control plane.
    # Set WELINK_SFT_TLS_PROXY on dev-backend to this container's exact IP.
    location /api/sft-worker/ {
        proxy_pass http://dev-backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass         http://dev-frontend:80;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
